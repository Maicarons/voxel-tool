name: Publish to npm

# 发布认证: 通过仓库密钥 NPM_TOKEN (npm Automation token) 注入 NODE_AUTH_TOKEN，
# 由 actions/setup-node 写入 .npmrc 供 npm publish 使用。无需在代码里硬编码令牌。
# 仍保留 --provenance 供应链溯源（依赖 id-token: write 的 OIDC）。
# 触发: 打 GitHub Release 自动发布；或在 Actions 页面手动 Run workflow。
on:
  release:
    types: [published]
  # 允许手动触发（例如改了认证方式后重跑，无需重建 Release）
  workflow_dispatch:

# id-token: write 仍保留，供 --provenance 供应链溯源使用。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 发布认证从仓库密钥 NPM_TOKEN (npm Automation token) 读取，注入 NODE_AUTH_TOKEN。
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      # 顺序: 先发 core, 再发它依赖的 viewer, 最后发依赖 viewer 的各框架组件
      # --provenance 生成供应链溯源证明 (需 OIDC, 与可信发布天然契合)
      - name: Publish @voxel-tool/core
        run: npm publish -w @voxel-tool/core --provenance --access public

      - name: Publish @voxel-tool/exporter
        run: npm publish -w @voxel-tool/exporter --provenance --access public

      - name: Publish @voxel-tool/viewer
        run: npm publish -w @voxel-tool/viewer --provenance --access public

      - name: Publish @voxel-tool/react
        run: npm publish -w @voxel-tool/react --provenance --access public

      - name: Publish @voxel-tool/vue
        run: npm publish -w @voxel-tool/vue --provenance --access public

      - name: Publish @voxel-tool/solid
        run: npm publish -w @voxel-tool/solid --provenance --access public

      - name: Publish @voxel-tool/preact
        run: npm publish -w @voxel-tool/preact --provenance --access public

      - name: Publish @voxel-tool/svelte
        run: npm publish -w @voxel-tool/svelte --provenance --access public

      - name: Publish @voxel-tool/qwik
        run: npm publish -w @voxel-tool/qwik --provenance --access public
