name: Publish to npm

# 发布认证: 通过仓库密钥 NPM_TOKEN (npm Automation token) 注入 NODE_AUTH_TOKEN，
# 由 actions/setup-node 写入 .npmrc 供 npm publish 使用。无需在代码里硬编码令牌。
# 仍保留 --provenance 供应链溯源（依赖 id-token: write 的 OIDC）。
# 触发: 打 GitHub Release 自动发布；或在 Actions 页面手动 Run workflow。
#
# 版本策略 (Changesets):
#   - 开发时通过 `npx changeset add` 累积待发布说明；
#   - 本工作流在发布前先 `npx changeset version` 消费这些说明、bump 相关包版本、
#     生成 CHANGELOG 并刷新 package-lock，再把版本 bump 提交回 main（best-effort）；
#   - 若没有待发布 changeset，则直接按 main 上现有版本发布（幂等，已发布的会跳过）。
on:
  release:
    types: [published]
  # 允许手动触发（例如改了认证方式后重跑，无需重建 Release）
  workflow_dispatch:

# id-token: write 仍保留，供 --provenance 供应链溯源使用。
# contents: write 供把版本 bump 提交回 main。
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 发布认证从仓库密钥 NPM_TOKEN (npm Automation token) 读取，注入 NODE_AUTH_TOKEN。
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 消费待发布 changeset：bump 版本 + 生成 CHANGELOG + 刷新 lock，
      # 再把结果提交回 main（best-effort，遇分支保护等失败时不影响后续发布）。
      - name: Consume changesets & bump versions
        run: |
          shopt -s nullglob
          cs=(.changeset/*.md)
          has=0
          for f in "${cs[@]}"; do
            [ "$(basename "$f")" != "README.md" ] && has=1 && break
          done
          if [ "$has" = "1" ]; then
            echo "pending changesets found -> bumping versions"
            npx changeset version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Version Packages" || echo "nothing to commit"
            git push origin "HEAD:refs/heads/main" || echo "push skipped (branch protection?)"
          else
            echo "no pending changesets -> publishing current versions as-is"
          fi

      - name: Build all packages
        run: npm run build

      # 顺序: core -> mesh -> exporter/viewer -> 各框架组件 -> cli。
      # mesh 被 viewer 与 exporter 共同依赖, 必须先于二者发布, 否则二者 npm publish 时
      # 依赖解析不到 @voxel-tool/mesh 而装包失败。
      # --provenance 生成供应链溯源证明 (需 OIDC, 与可信发布天然契合)。
      # 幂等: 若某包当前版本已在 registry 存在则跳过，避免重跑时遇 409 中断整个 job
      # (例如 core/viewer 等已发布、只有新增的 mesh / bump 后的 exporter 需要发的情况)。
      - name: Publish all packages (idempotent, dependency order)
        run: |
          publish_pkg () {
            local name="$1" dir="$2"
            local ver
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip: $name@$ver already published"
            else
              echo "publishing $name@$ver"
              npm publish -w "$name" --provenance --access public
            fi
          }
          publish_pkg @voxel-tool/core      packages/core
          publish_pkg @voxel-tool/mesh      packages/mesh
          publish_pkg @voxel-tool/exporter  packages/exporter
          publish_pkg @voxel-tool/viewer    packages/viewer
          publish_pkg @voxel-tool/react     packages/react
          publish_pkg @voxel-tool/vue       packages/vue
          publish_pkg @voxel-tool/solid     packages/solid
          publish_pkg @voxel-tool/preact    packages/preact
          publish_pkg @voxel-tool/svelte    packages/svelte
          publish_pkg @voxel-tool/qwik      packages/qwik
          publish_pkg @voxel-tool/cli       packages/cli
